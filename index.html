<div class="extension_container">
    <div class="inline-drawer">
        <div class="inline-drawer-toggle inline-drawer-header">
            <b>ST-auto-reply</b>
            <div class="inline-drawer-icon fa-solid fa-circle-chevron-down down"></div>
        </div>
        <div class="inline-drawer-content">
            <label for="input_director_name">导演角色卡名字:</label>
            <input placeholder="导演角色卡名字" type="text" class="text_pole" id="input_director_name">
            <label for="input_exclude_text">排除文本正则表达式:</label>
            <input placeholder="不输入默认为空,不进行排除" type="text" class="text_pole" id="input_exclude_text">

            <span>获取到的群组成员信息:</span>
            <textarea rows="10" id="input_group_members" disabled></textarea>
            <div class="flex-container">
                <input id="create_append_but" type="checkbox" checked />
                <label for="create_append_but">创建按钮</label>
            </div>
            <input id="auto-reply-apply-button" class="menu_button" type="button" value="应用" />

        </div>
    </div>
</div>
